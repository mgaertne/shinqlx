name: CI

on: [ push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --workspace --each-feature --exclude-features default,bench-support

  check-tests:
    name: Check (tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --workspace --each-feature --exclude-features default,bench-support --tests

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - run: cargo hack clippy --workspace --each-feature --exclude-features default,bench-support -- -D warnings

  clippy-tests:
    name: Clippy (tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - run: cargo hack clippy --workspace --each-feature --exclude-features default,bench-support --tests -- -D warnings

  test-features:
    name: Test (feature combinations)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [ check-tests, clippy-tests ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --workspace --each-feature --exclude-features default,bench-support

  rust-doc:
    name: rust-documentation
    runs-on: ubuntu-latest
    needs: [ check, clippy ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo doc --workspace --no-deps

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    needs: [ check, clippy ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install depend1encies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      - name: Test with tox
        run: tox -r -e ruff,mypy,ty,stubtest,stubs

  python-doc:
    name: python-documentation
    runs-on: ubuntu-latest
    needs: [ check, clippy ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install depend1encies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      - run: tox -r -e docs
      - name: Upload html-docs
        uses: actions/upload-artifact@v7
        with:
          name: html-docs
          path: _docs_out/*

  build:
    name: build & test
    runs-on: ${{ matrix.os }}
    needs: [ check-tests, clippy-tests ]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.15' ]
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: python-${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
        timeout-minutes: 15

  minimal_build:
    name: build & test with minimal versions
    runs-on: ${{ matrix.os }}
    needs: [ check-tests, clippy-tests ]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.15' ]
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: python-${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: cargo build --workspace -Z minimal-versions --verbose
      - run: cargo test --workspace -Z minimal-versions --verbose
        timeout-minutes: 15

  tarpaulin-coverage:
    runs-on: ubuntu-latest
    needs: [ build ]
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: "llvm-tools"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - run: cargo tarpaulin
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: tarpaulin-coverage-report
          path: cobertura.xml

  llvm-cov-coverage:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: "llvm-tools"
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      #      - name: Upload to codecov.io
      #        uses: codecov/codecov-action@v7
      #        with:
      #          token: ${{secrets.CODECOV_TOKEN}}
      #          files: lcov.info
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: llvm-coverage-report
          path: lcov.info

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: miri
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: cargo miri test
      - run: cargo miri test -p ql_sqx
      - run: cargo miri test --features demo-recording --lib demo

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [ check, check-tests, clippy, clippy-tests, test-features, rust-doc, python-doc, miri, tarpaulin-coverage, build, python-checks ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build the stub distributions
        run: |
          python -m pip install build
          python tools/build_stubs.py stubs
          python -m build --outdir stubs-dist stubs/shinqlx-stubs
          python -m build --outdir stubs-dist stubs/minqlx-stubs
      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*
      - name: Publish the stub distributions to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing stubs-dist/*
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist
      - name: Upload run_server_shinqlx.sh
        uses: actions/upload-artifact@v7
        with:
          name: run_server_shinqlx.sh
          path: run_server_shinqlx.sh
      - name: Upload shinqlx_log.yml
        uses: actions/upload-artifact@v7
        with:
          name: shinqlx_log.yml
          path: shinqlx_log.yml

  build-binaries:
    name: build
    needs: [ check, check-tests, clippy, clippy-tests ]

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build -p ql_rcon --release --verbose
      - run: cargo build -p ql_stats --release --verbose
      - run: cargo build -p plugin_migration --release --verbose
      - run: cargo build -p ql_demo --release --verbose
      - name: Provide build artifacts
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ql_rcon_${{ matrix.os }}
          path: target/release/ql_rcon
      - name: Provide build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ql_rcon_${{ matrix.os }}
          path: target/release/ql_rcon.exe
      - name: Provide build artifacts
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ql_stats_${{ matrix.os }}
          path: target/release/ql_stats
      - name: Provide build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ql_stats_${{ matrix.os }}
          path: target/release/ql_stats.exe
      - name: Provide build artifacts
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: plugin_migration_${{ matrix.os }}
          path: target/release/plugin_migration
      - name: Provide build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: plugin_migration_${{ matrix.os }}
          path: target/release/plugin_migration.exe
      - name: Provide build artifacts
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ql_demo_${{ matrix.os }}
          path: target/release/ql_demo
      - name: Provide build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ql_demo_${{ matrix.os }}
          path: target/release/ql_demo.exe

  publish-github:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [ publish-pypi, build-binaries, python-doc ]
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package the release assets
        run: |
          mkdir assets
          for tool in ql_rcon ql_stats plugin_migration ql_demo; do
            for os in ubuntu-latest macos-latest; do
              chmod +x "artifacts/${tool}_${os}/${tool}"
              tar -czf "assets/${tool}-${GITHUB_REF_NAME}-${os}.tar.gz" -C "artifacts/${tool}_${os}" "${tool}"
            done
            zip -j "assets/${tool}-${GITHUB_REF_NAME}-windows-latest.zip" "artifacts/${tool}_windows-latest/${tool}.exe"
          done
          (cd artifacts/html-docs && zip -qr "../../assets/shinqlx-docs-${GITHUB_REF_NAME}.zip" .)
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: Extract the release notes of this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## ${version}" 'index($0, header) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" assets/* --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
