cargo-features = ["profile-rustflags"]

[workspace]
members = ["ql_rcon", "ql_stats", "ql_zmq", "plugin_migration"]

[workspace.package]
rust-version = "1.95"
edition = "2024"
version = "0.8.1-alpha.1"
authors = ["Markus 'ShiN0' Gaertner"]

[workspace.dependencies]
arzmq = { version = ">=0.7", default-features = false, features = ["builder", "futures"] }
serde_json = { version = ">=1.0.145", default-features = false, features = ["alloc"] }

[package]
name = "shinqlx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "ShiN0's QuakeLive extension in Rust"
repository = "https://github.com/mgaertne/shinqlx"
license-file = "LICENSE"
include = ["run_server_shinqlx.sh", "shinqlx_log.yml"]
publish = false

[lib]
name = "shinqlx"
path = "src/lib.rs"
test = true
bench = true
doc = true
doctest = false
proc-macro = false
harness = true
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "shinqlx_benchmark"

[[bench]]
name = "shinqlx_limiter_benchmark"
required-features = ["bench-support", "steam-query-limit"]

[[bench]]
name = "shinqlx_python_benchmark"
required-features = ["bench-support"]

[profile.release]
strip = "symbols"
opt-level = 3
lto = "fat"
codegen-units = 1
rustflags = ["-Zlocation-detail=none"]

[profile.release.build-override]
rustflags = ["-Zlocation-detail=none"]

[dependencies]
serde_json = { workspace = true }
regex-lite = { version = ">=0.1.9", default-features = false, features = ["std", "string"] }
arzmq = { workspace = true, features = ["builder", "futures"] }
async-io = { version = ">=2.6", default-features = false }
futures = { version = ">=0.3", default-features = false, features = ["std"] }

rustversion = { version = ">=1.0", default-features = false }
ctor = { version = ">=1.0", default-features = false, features = ["proc_macro"] }
rand = { version = ">=0.10", default-features = false, features = ["thread_rng"] }
pyo3 = { version = ">=0.30, <0.31", default-features = false, features = ["macros", "extension-module", "nightly"] }
detour = { version = ">=0.10.0", default-features = false, features = ["no_std"] }
derive_builder = { version = ">=0.20", default-features = false, features = ["clippy", "alloc"] }
arc-swap = { version = ">=1.9", default-features = false }
tap = { version = ">=1.0.1", default-features = false }
rayon = { version = ">=1.12", default-features = false }
derive_more = { version = ">=2.1", default-features = false, features = ["display", "try_from"]}
bitflags = { version = ">=2.6", default-features = false }
derive-new = { version = ">=0.7", default-features = false }
anyhow = { version = ">=1.0", default-features = false, features = ["std"] }
log = { version = ">=0.4", default-features = false, features = ["kv"] }
log4rs = { version = ">=1.4", default-features = false, features = ["console_appender", "rolling_file_appender", "compound_policy", "size_trigger", "fixed_window_roller", "delete_roller", "threshold_filter", "config_parsing", "yaml_format", "log_kv"] }
serde = { version = ">=1.0", default-features = false, features = ["derive", "std"] }
signal-hook = { version = ">=0.4", default-features = false }
signal-hook-registry = { version = ">=1.4", default-features = false }
chrono = { version = ">=0.4.41", default-features = false, features = ["now", "clock"] }
itertools = { version = ">=0.15", default-features = false, features = ["use_alloc"] }
arrayvec = { version = ">=0.7", default-features = false }
cfg-if = { version = ">=1.0", default-features = false }
parking_lot = { version = ">=0.13", default-features = false, features = ["nightly"] }
git2 = { version = ">=0.21", default-features = false }
semver = { version = ">=1.0", default-features = false }
unicode-segmentation = { version = ">=1.13", default-features = false, features = ["no_std"] }

region = { version = ">=4.0", default-features = false, optional = true }
zip = { version = ">=9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(target_os = \"linux\")".dependencies]
procfs = { version = ">=0.18", default-features = false }

[target."cfg(unix)".dependencies]
libc = { version = ">=0.2", default-features = false }

[target."cfg(not(windows))".dependencies]
tikv-jemallocator = { version = ">=0.7", default-features = false, features = ["background_threads_runtime_support"], optional = true }

[target."cfg(windows)".dependencies]
mimalloc = { version = ">=0.1.52", default-features = false, optional = true }

[build-dependencies]
pyo3-build-config = { version = ">=0.30, <0.31", default-features = false, features = ["resolve-config"] }
git2 = { version = ">=0.21", default-features = false }

[dev-dependencies]
pretty_assertions = { version = ">=1.4", default-features = false, features = ["alloc"] }
rstest = { version = ">=0.28", default-features = false }
mockall = { version = ">=0.15", default-features = false, features = ["nightly"] }
serial_test = { version = ">=4.0", default-features = false }
tempfile = { version = ">=3.27", default-features = false }
# lets the test watchdog report lock cycles; serial_test and log4rs still use parking_lot 0.12
parking_lot = { version = ">=0.13", default-features = false, features = ["nightly", "deadlock_detection"] }
parking_lot_012 = { package = "parking_lot", version = "0.12.5", default-features = false, features = ["deadlock_detection"] }

# for benchmark tests
criterion = { version = ">=0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }
criterion-macro = { version = ">=0.4", default-features = false }
# keeps minimal-versions away from is_terminal_polyfill 1.48, which pulls in rustix 0.36 that no longer compiles
is_terminal_polyfill = { version = ">=1.70", default-features = false }

[features]
default = ["alloc", "steam-query-limit", "zmq-rcon-fix"]
# use jemalloc (mimalloc on Windows) as global allocator instead of the system allocator
alloc = ["dep:tikv-jemallocator", "dep:mimalloc"]
# rate limit for server queries (A2S_INFO, A2S_PLAYER, A2S_RULES) against reflection and flood attacks
steam-query-limit = []
# patch the callvote clientkick lookup in qagame, experimental
clientkick-fix = ["dep:region"]
# let qagame register sv_fps with 125 instead of the read-only default 40, experimental
fps-patch = ["dep:region"]
# drop the engine's report about a disconnected ZMQ RCON client, which crashes the server when several clients die at once
zmq-rcon-fix = []
# race maps: keep the run time on repeated touches and let target_init triggers honour their KEEP* spawnflags, experimental
race-hooks = []
# all patches and fixes
patches = ["clientkick-fix", "fps-patch", "zmq-rcon-fix", "steam-query-limit"]
# expose internals to the benchmarks, not meant for production builds
bench-support = []

[workspace.lints.rust]
missing_docs = "warn"
non_local_definitions = "allow"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly,tarpaulin_include)'] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[lints]
workspace = true
