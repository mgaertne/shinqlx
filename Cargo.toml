cargo-features = ["profile-rustflags"]

[workspace]
members = ["ql_rcon", "ql_stats"]

[workspace.package]
rust-version = "1.95"
edition = "2024"
version = "0.8.0-alpha.1"
authors = ["Markus 'ShiN0' Gaertner"]

[workspace.dependencies]
arzmq = { version = ">=0.7", default-features = false }
regex = { version = ">=1.13", default-features = false, features = ["perf", "unicode"] }
serde_json = { version = ">=1.0.145", default-features = false, features = ["alloc"] }

[package]
name = "shinqlx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "ShiN0's QuakeLive extension in Rust"
repository = "https://github.com/mgaertne/shinqlx"
license-file = "LICENSE"
include = ["run_server_shinqlx.sh", "shinqlx_log.yml"]
publish = false

[lib]
name = "shinqlx"
path = "src/lib.rs"
test = true
bench = true
doc = true
doctest = false
proc-macro = false
harness = true
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "shinqlx_benchmark"

[[bench]]
name = "shinqlx_python_benchmark"
required-features = ["bench-support"]

[profile.release]
strip = "symbols"
opt-level = "z"
lto = "fat"
codegen-units = 1
rustflags = ["-Zlocation-detail=none"]

[profile.release.build-override]
rustflags = ["-Zlocation-detail=none"]

[dependencies]
serde_json = { workspace = true }
regex-lite = { version = ">=0.1.9", default-features = false, features = ["std", "string"] }
arzmq = { workspace = true, features = ["builder"] }

rustversion = { version = ">=1.0", default-features = false }
ctor = { version = ">=1.0", default-features = false, features = ["proc_macro"] }
rand = { version = ">=0.10", default-features = false, features = ["thread_rng"] }
pyo3 = { version = ">=0.30, <0.31", default-features = false, features = ["macros", "extension-module", "nightly"] }
detour = { version = ">=0.10.0", default-features = false, features = ["no_std"] }
derive_builder = { version = ">=0.20", default-features = false, features = ["clippy", "alloc"] }
arc-swap = { version = ">=1.9", default-features = false }
tap = { version = ">=1.0.1", default-features = false }
rayon = { version = ">=1.12", default-features = false }
derive_more = { version = ">=2.1", default-features = false, features = ["display", "try_from"]}
derive-new = { version = ">=0.7", default-features = false }
log = { version = ">=0.4", default-features = false }
log4rs = { version = ">=1.4", default-features = false, features = ["console_appender", "config_parsing", "yaml_format"] }
signal-hook = { version = ">=0.4", default-features = false }
signal-hook-registry = { version = ">=1.4", default-features = false }
chrono = { version = ">=0.4.41", default-features = false, features = ["now"] }
itertools = { version = ">=0.15", default-features = false, features = ["use_alloc"] }
arrayvec = { version = ">=0.7", default-features = false }
cfg-if = { version = ">=1.0", default-features = false }
parking_lot = { version = ">=0.13", default-features = false, features = ["nightly"] }
git2 = { version = ">=0.21", default-features = false }
semver = { version = ">=1.0", default-features = false }
unicode-segmentation = { version = ">=1.13", default-features = false, features = ["no_std"] }

region = { version = ">=4.0", default-features = false, optional = true }

[target."cfg(target_os = \"linux\")".dependencies]
procfs = { version = ">=0.18", default-features = false }

[target."cfg(not(windows))".dependencies]
tikv-jemallocator = { version = ">=0.7", default-features = false, features = ["background_threads_runtime_support"], optional = true }

[target."cfg(windows)".dependencies]
mimalloc = { version = ">=0.1.52", default-features = false, optional = true }

[build-dependencies]
pyo3-build-config = { version = ">=0.30, <0.31", default-features = false, features = ["resolve-config"] }
git2 = { version = ">=0.21", default-features = false }

[dev-dependencies]
pretty_assertions = { version = ">=1.4", default-features = false, features = ["alloc"] }
rstest = { version = ">=0.28", default-features = false }
mockall = { version = ">=0.15", default-features = false, features = ["nightly"] }
serial_test = { version = ">=4.0", default-features = false }
tempfile = { version = ">=3.27", default-features = false }

# for benchmark tests
criterion = { version = ">=0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }
criterion-macro = { version = ">=0.4", default-features = false }

[features]
default = ["alloc", "steam-query-limit"]
# use jemalloc (mimalloc on Windows) as global allocator instead of the system allocator
alloc = ["dep:tikv-jemallocator", "dep:mimalloc"]
# rate limit for server queries (A2S_INFO, A2S_PLAYER, A2S_RULES) against reflection and flood attacks
steam-query-limit = []
# patch the callvote clientkick lookup in qagame, experimental
patches = ["dep:region"]
# expose internals to the benchmarks, not meant for production builds
bench-support = []

[lints.rust]
missing_docs = "warn"
non_local_definitions = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly,tarpaulin_include)'] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
