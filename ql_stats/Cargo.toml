cargo-features = ["profile-rustflags"]

[package]
name = "ql_stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
arzmq = { workspace = true, default-features = false, features = ["builder", "futures", "draft-api"] }
tokio = { version = ">=1.53", default-features = false, features = ["default", "macros", "rt", "sync", "time"] }
tokio-util = { version = ">=0.7", default-features = false }
anyhow = { version = ">=1.0", default-features = false }
ql_zmq = { path = "../ql_zmq" }
clap = { version = ">=4.6", default-features = false, features = ["std", "derive", "color", "help", "usage", "wrap_help", "string"] }

serde_json = { workspace = true, default-features = false, features = ["alloc", "preserve_order"] }

[lints]
workspace = true
